dth="62.8" height="40" rx="8" fill="#34d3991f" stroke="#34d3997a" stroke-width="1.4" /><text x="393.76" y="115.95" font-family="ui-monospace, 'Cascadia Code', 'Cascadia Mono', Consolas, 'Courier New', monospace" font-size="17" font-weight="600" fill="#34d399" text-anchor="middle">body</text><rect x="429.16" y="90" width="62.8" height="40" rx="8" fill="#34d3991f" stroke="#34d3997a" stroke-width="1.4" /><text x="460.56" y="115.95" font-family="ui-monospace, 'Cascadia Code', 'Cascadia Mono', Consolas, 'Courier New', monospace" font-size="17" font-weight="600" fill="#34d399" text-anchor="middle">body</text><rect x="495.96" y="90" width="62.8" height="40" rx="8" fill="#fb71851f" stroke="#fb71857a" stroke-width="1.4" /><text x="527.36" y="115.95" font-family="ui-monospace, 'Cascadia Code', 'Cascadia Mono', Consolas, 'Courier New', monospace" font-size="17" font-weight="600" fill="#fb7185" text-anchor="middle">stop</text><rect x="157.96" y="86" width="70.8" height="48" rx="11" fill="#8b6cff14" stroke="#8b6cff" stroke-width="2"><animate attributeName="x" values="157.96;224.76;291.56;358.36;425.16;491.96" keyTimes="0;0.17;0.33;0.5;0.67;0.83" calcMode="discrete" dur="5.4s" repeatCount="indefinite" /><animate attributeName="width" values="70.8;70.8;70.8;70.8;70.8;70.8" keyTimes="0;0.17;0.33;0.5;0.67;0.83" calcMode="discrete" dur="5.4s" repeatCount="indefinite" /></rect><text x="86.5" y="201.95" font-family="ui-monospace, 'Cascadia Code', 'Cascadia Mono', Consolas, 'Courier New', monospace" font-size="17" font-weight="400" fill="#a5a4b8" text-anchor="start">init   k = 1</text><text x="247.1" y="201.95" font-family="ui-monospace, 'Cascadia Code', 'Cascadia Mono', Consolas, 'Courier New', monospace" font-size="17" font-weight="600" fill="#eceaf6" text-anchor="start">once</text><text x="448.5" y="200.83" font-family="ui-monospace, 'Cascadia Code', 'Cascadia Mono', Consolas, 'Courier New', monospace" font-size="13.8" font-weight="400" fill="#74738a" text-anchor="start">before anything</text><text x="86.5" y="229.95" font-family="ui-monospace, 'Cascadia Code', 'Cascadia Mono', Consolas, 'Courier New', monospace" font-size="17" font-weight="400" fill="#a5a4b8" text-anchor="start">test   k &lt;= 5</text><text x="247.1" y="229.95" font-family="ui-monospace, 'Cascadia Code', 'Cascadia Mono', Consolas, 'Courier New', monospace" font-size="17" font-weight="600" fill="#34d399" text-anchor="start">before every pass</text><text x="86.5" y="257.95" font-family="ui-monospace, 'Cascadia Code', 'Cascadia Mono', Consolas, 'Courier New', monospace" font-size="17" font-weight="400" fill="#a5a4b8" text-anchor="start">update k++</text><text x="247.1" y="257.95" font-family="ui-monospace, 'Cascadia Code', 'Cascadia Mono', Consolas, 'Courier New', monospace" font-size="17" font-weight="600" fill="#fbbf24" text-anchor="start">after every pass</text><text x="30" y="307.83" font-family="ui-monospace, 'Cascadia Code', 'Cascadia Mono', Consolas, 'Courier New', monospace" font-size="13.8" font-weight="700" fill="#fbbf24" text-anchor="start">!</text><text x="52" y="308.18" font-family="ui-monospace, 'Cascadia Code', 'Cascadia Mono', Consolas, 'Courier New', monospace" font-size="14.8" font-weight="400" fill="#fbbf24" text-anchor="start">The count is visible in the header. That is when for beats while.</text><text x="329.6" y="339.18" font-family="ui-monospace, 'Cascadia Code', 'Cascadia Mono', Consolas, 'Courier New', monospace" font-size="14.8" font-weight="400" fill="#74738a" text-anchor="middle">The sixth test is the one that ends it, and it runs no body.</text></g></svg>
