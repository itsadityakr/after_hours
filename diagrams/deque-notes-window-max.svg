"46" height="40" rx="8" fill="#34d3991f" stroke="#34d3997a" stroke-width="1.4" /><text x="244.68" y="209.95" font-family="ui-monospace, 'Cascadia Code', 'Cascadia Mono', Consolas, 'Courier New', monospace" font-size="17" font-weight="600" fill="#34d399" text-anchor="middle">3</text><rect x="271.68" y="184" width="46" height="40" rx="8" fill="#34d3991f" stroke="#34d3997a" stroke-width="1.4" /><text x="294.68" y="209.95" font-family="ui-monospace, 'Cascadia Code', 'Cascadia Mono', Consolas, 'Courier New', monospace" font-size="17" font-weight="600" fill="#34d399" text-anchor="middle">3</text><rect x="321.68" y="184" width="46" height="40" rx="8" fill="#34d3991f" stroke="#34d3997a" stroke-width="1.4" /><text x="344.68" y="209.95" font-family="ui-monospace, 'Cascadia Code', 'Cascadia Mono', Consolas, 'Courier New', monospace" font-size="17" font-weight="600" fill="#34d399" text-anchor="middle">5</text><rect x="371.68" y="184" width="46" height="40" rx="8" fill="#34d3991f" stroke="#34d3997a" stroke-width="1.4" /><text x="394.68" y="209.95" font-family="ui-monospace, 'Cascadia Code', 'Cascadia Mono', Consolas, 'Courier New', monospace" font-size="17" font-weight="600" fill="#34d399" text-anchor="middle">5</text><rect x="421.68" y="184" width="46" height="40" rx="8" fill="#34d3991f" stroke="#34d3997a" stroke-width="1.4" /><text x="444.68" y="209.95" font-family="ui-monospace, 'Cascadia Code', 'Cascadia Mono', Consolas, 'Courier New', monospace" font-size="17" font-weight="600" fill="#34d399" text-anchor="middle">6</text><rect x="471.68" y="184" width="46" height="40" rx="8" fill="#34d3991f" stroke="#34d3997a" stroke-width="1.4" /><text x="494.68" y="209.95" font-family="ui-monospace, 'Cascadia Code', 'Cascadia Mono', Consolas, 'Courier New', monospace" font-size="17" font-weight="600" fill="#34d399" text-anchor="middle">7</text><text x="97.2" y="265.95" font-family="ui-monospace, 'Cascadia Code', 'Cascadia Mono', Consolas, 'Courier New', monospace" font-size="17" font-weight="400" fill="#a5a4b8" text-anchor="start">record from</text><text x="278.2" y="265.95" font-family="ui-monospace, 'Cascadia Code', 'Cascadia Mono', Consolas, 'Courier New', monospace" font-size="17" font-weight="600" fill="#8b6cff" text-anchor="start">i &gt;= k - 1</text><text x="438.8" y="264.83" font-family="ui-monospace, 'Cascadia Code', 'Cascadia Mono', Consolas, 'Courier New', monospace" font-size="13.8" font-weight="400" fill="#74738a" text-anchor="start">into out[i - k + 1]</text><text x="97.2" y="293.95" font-family="ui-monospace, 'Cascadia Code', 'Cascadia Mono', Consolas, 'Courier New', monospace" font-size="17" font-weight="400" fill="#a5a4b8" text-anchor="start">sliding minimum</text><text x="278.2" y="293.95" font-family="ui-monospace, 'Cascadia Code', 'Cascadia Mono', Consolas, 'Courier New', monospace" font-size="17" font-weight="600" fill="#fbbf24" text-anchor="start">flip &lt;= to &gt;=</text><text x="438.8" y="292.83" font-family="ui-monospace, 'Cascadia Code', 'Cascadia Mono', Consolas, 'Courier New', monospace" font-size="13.8" font-weight="400" fill="#74738a" text-anchor="start">nothing else changes</text><text x="350.8" y="329.18" font-family="ui-monospace, 'Cascadia Code', 'Cascadia Mono', Consolas, 'Courier New', monospace" font-size="14.8" font-weight="400" fill="#74738a" text-anchor="middle">k = 3. Each index is added once and removed once, so the pass is O(n).</text></g></svg>
