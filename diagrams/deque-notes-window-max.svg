<svg xmlns="http://www.w3.org/2000/svg" width="780" height="366" viewBox="0 0 780 366" data-fit="1" role="img" aria-label="The window of size k sliding, and the maximum it reports each time"><defs><marker id="arrow-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#8b8ba3" /></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#34d399" /></marker></defs><style>.pulse{animation:dg-pulse 2.6s ease-in-out infinite}@keyframes dg-pulse{0%,100%{opacity:1}50%{opacity:.4}}.flowing{stroke-dasharray:7 5;animation:dg-flow 1.1s linear infinite}@keyframes dg-flow{to{stroke-dashoffset:-12}}@media (prefers-reduced-motion:reduce){.pulse,.flowing{animation:none}.flowing{stroke-dasharray:7 5}}</style><rect width="780" height="366" fill="#0d0e14" /><g transform="translate(39.2 0) scale(1)"><text x="350.8" y="45.65" font-family="'Inter', system-ui, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#eceaf6" text-anchor="middle" letter-spacing="0.4">THE MAXIMUM OF EVERY WINDOW</text><text x="175.8" y="82.62" font-family="ui-monospace, 'Cascadia Code', 'Cascadia Mono', Consolas, 'Courier New', monospace" font-size="13.2" font-weight="400" fill="#74738a" text-anchor="middle">0</text><text x="225.8" y="82.62" font-family="ui-monospace, 'Cascadia Code', 'Cascadia Mono', Consolas, 'Courier New', monospace" font-size="13.2" font-weight="400" fill="#74738a" text-anchor="middle">1</text><text x="275.8" y="82.62" font-family="ui-monospace, 'Cascadia Code', 'Cascadia Mono', Consolas, 'Courier New', monospace" font-size="13.2" font-weight="400" fill="#74738a" text-anchor="middle">2</text><text x="325.8" y="82.62" font-family="ui-monospace, 'Cascadia Code', 'Cascadia Mono', Consolas, 'Courier New', monospace" font-size="13.2" font-weight="400" fill="#74738a