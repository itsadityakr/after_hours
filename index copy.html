<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <!-- `viewport-fit=cover` is what makes env(safe-area-inset-*) report real
         numbers. Without it a notched phone letterboxes the page and every
         safe-area rule in motion.css quietly resolves to zero. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="color-scheme" content="light dark" />
    <title>After Hours — small desktop tools by Aditya Kumar</title>
    <meta
      name="description"
      content="Free, open-source Windows utilities built after hours: Me Not AFK, Shut Me Down, Context Menu Tool and Control Deck. MIT licensed, no telemetry."
    />
    <meta property="og:title" content="After Hours — small desktop tools" />
    <meta
      property="og:description"
      content="Windows utilities built after hours by Aditya Kumar. MIT licensed, no telemetry, no accounts."
    />
    <meta property="og:type" content="website" />
    <script>
      // Assets are referenced relatively, which resolves against the directory
      // this document is in — so /after_hours would look for them one level too
      // high while /after_hours/ works. Hosts normally redirect to add the
      // slash; this makes sure of it before anything else loads.
      if (location.pathname && !location.pathname.endsWith('/') && !/\.[^/]+$/.test(location.pathname)) {
        location.replace(location.pathname + '/' + location.search + location.hash)
      }
    </script>
    <script>
      // Resolve the stored theme before first paint so there is no flash.
      try {
        const stored = JSON.parse(localStorage.getItem('afterhours:theme') || '"system"')
        const dark =
          stored === 'dark' ||
          (stored === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
      } catch {}
    </script>
    <script type="module" crossorigin src="./assets/index-BKimx8l8.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-B8Bv6Vxp.css">
  </head>

    <div id="root"></div>
  </body>
</html>
